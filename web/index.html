<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foxhound 交互演练台</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <strong>Foxhound 演练台</strong>
          <span>手动测向 / 清除</span>
        </div>
        <div class="controls">
          <label class="field">问题
            <select id="problem">
              <option value="3">3 · 全向源</option>
              <option value="4">4 · 全向+定向</option>
            </select>
          </label>
          <label class="field">种子
            <input id="seed" type="number" inputmode="numeric" min="1" step="1" />
          </label>
          <button id="new-case" type="button">新开一局</button>
          <label class="toggle"><input id="show-truth" type="checkbox" checked /> 显示真值</label>
          <label class="toggle"><input id="show-region" type="checkbox" checked /> 显示交会区</label>
        </div>
        <div class="kpis">
          <div class="kpi"><b id="kpi-time">0.000 s</b><span>虚拟时间</span></div>
          <div class="kpi"><b id="kpi-clear">0</b><span id="kpi-clear-label">已清除</span></div>
          <div class="kpi"><b id="kpi-avg">—</b><span>平均清除时间</span></div>
          <div class="kpi"><b id="kpi-df">CH 1</b><span>测向机频道</span></div>
        </div>
      </header>
      <main class="workspace">
        <section class="map-wrap" aria-label="目标区域地图">
          <canvas id="map" tabindex="0"></canvas>
          <aside class="map-hud" aria-label="地图读数">
            <div class="hud-block">
              <span class="hud-kicker">下一测点</span>
              <strong id="hud-aim">400.0, 0.0</strong>
              <p id="hud-aim-meta">距离 — · 方位 —</p>
            </div>
            <div class="hud-block" id="hud-region" hidden>
              <span class="hud-kicker">交会 CH <span id="hud-region-ch">1</span></span>
              <p id="hud-region-meta"></p>
            </div>
            <div class="hud-chips">
              <span>接收 1000 m</span>
              <span>清除 20 m</span>
            </div>
          </aside>
          <div id="cinematic" class="cinematic" data-mode="intro" aria-hidden="true">
            <div class="cinematic-rings" aria-hidden="true"></div>
            <div class="cinematic-inner">
              <p id="cinematic-kicker" class="cinematic-kicker">FOXHOUND</p>
              <h1 id="cinematic-title" class="cinematic-title">进入目标区域</h1>
              <p id="cinematic-sub" class="cinematic-sub">单击任意处跳过</p>
            </div>
          </div>
          <div class="hint" id="map-hint">
            单击地图或输入坐标 · 滚轮缩放 · 拖动平移 · M 测向 · C 清除
          </div>
        </section>
        <aside class="side">
          <section class="card">
            <h2>操作频道 <span id="op-channel">1</span></h2>
            <div id="channels" class="channels" role="group" aria-label="频道 1 到 20"></div>
          </section>
          <section class="card">
            <h2>操作</h2>
            <div class="aim-fields">
              <label class="field">x
                <input id="aim-x" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" />
              </label>
              <label class="field">y
                <input id="aim-y" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" />
              </label>
            </div>
            <p id="aim-live" class="aim-live" aria-live="polite">(400.0, 0.0)</p>
            <div class="actions">
              <button id="btn-measure" class="primary" type="button">测向 /measure</button>
              <button id="btn-clear" class="danger" type="button">清除 /clear</button>
              <button id="btn-goto" type="button">预估移动耗时</button>
              <button id="btn-exit" type="button">结束 /exit</button>
            </div>
            <p id="preview" class="result" aria-live="polite"></p>
          </section>
          <section class="card journal-card">
            <h2>记录</h2>
            <p id="feedback" class="result journal-now" role="status" aria-live="assertive">先在地图上点一个测点。</p>
            <div id="log" class="log"></div>
          </section>
          <section class="legend">
            <span><i class="swatch" style="background:#22c55e"></i>机器狗</span>
            <span><i class="swatch" style="background:#22d3ee"></i>接收半径</span>
            <span><i class="swatch" style="background:#4ade80"></i>清除半径</span>
            <span><i class="swatch" style="background:#f8fafc"></i>最小覆盖圆</span>
            <span><i class="swatch" style="background:#ef4444"></i>已测未清</span>
            <span><i class="swatch" style="background:#3b82f6"></i>MEC≤20 m</span>
            <span><i class="swatch" style="background:#fb7185"></i>交会区</span>
          </section>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
